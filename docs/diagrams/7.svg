<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1270" viewBox="0 0 1400 1270"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="700" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="black">D07. Открытие формы добавления или редактирования товара</text><path d="M 700 114 V 150" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 300 V 334 H 300 V 380" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="321" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 700 300 V 334 H 1090 V 380" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="895" y="321" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 1090 444 V 505" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1090 655 V 689 H 680 V 735" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="885" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 680 799 V 833 H 1280 V 26 H 700 V 60" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Вернуться к каталогу</text><path d="M 1090 655 V 735" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="1090" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 300 448 V 580.1600000000001 H 700 V 920" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1090 803 V 837 H 700 V 920" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 988 V 1040" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="540" y="60" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Каталог администратора</tspan></text></g><g><path d="M 700 150 L 850 225 L 700 300 L 550 225 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="221.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Нажата кнопка «Добавить</tspan><tspan x="700" dy="21">товар»?</tspan></text></g><g><rect x="95" y="380" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="300" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="300" dy="0">Создать форму: ID не показывать</tspan></text></g><g><path d="M 909 380 L 1295 380 L 1271 444 L 885 444 Z" fill="white" stroke="black" stroke-width="2"/><text x="1090" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1090" dy="0">Выбрать товар в списке</tspan></text></g><g><path d="M 1090 505 L 1240 580 L 1090 655 L 940 580 Z" fill="white" stroke="black" stroke-width="2"/><text x="1090" y="576.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1090" dy="0">Форма редактирования уже</tspan><tspan x="1090" dy="21">открыта?</tspan></text></g><g><path d="M 504 735 L 880 735 L 856 799 L 480 799 Z" fill="white" stroke="black" stroke-width="2"/><text x="680" y="763.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="680" dy="0">Показать: можно открыть только одну</tspan><tspan x="680" dy="21">форму</tspan></text></g><g><rect x="885" y="735" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1090" y="765.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1090" dy="0">Загрузить данные товара; ID доступен</tspan><tspan x="1090" dy="21">только для чтения</tspan></text></g><g><rect x="495" y="920" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="700" y="961" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Открыть форму с полями товара</tspan></text></g><g><rect x="540" y="1040" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="1063.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Перейти к проверке и сохранению</tspan><tspan x="700" dy="21">(D08)</tspan></text></g></svg>