<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1420" viewBox="0 0 1400 1420"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="700" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="black">D06. Поиск, фильтрация и сортировка товаров</text><path d="M 700 114 V 145" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 209 V 245" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 313 V 355" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 505 V 539 H 300 V 580" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 700 505 V 539 H 1090 V 580" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="895" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 300 648 V 682 H 700 V 710" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1090 648 V 682 H 700 V 710" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 860 V 894 H 300 V 930" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="881" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 700 860 V 894 H 1090 V 930" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="895" y="881" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 300 998 V 1032 H 700 V 1060" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1090 998 V 1032 H 700 V 1060" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 1128 V 1170" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 1238 V 1285" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 1339 V 1373 H 1340 V 111 H 700 V 145" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="1360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Изменить параметры</text><g><rect x="540" y="60" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Каталог открыт</tspan></text></g><g><path d="M 519 145 L 905 145 L 881 209 L 495 209 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="173.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Изменить поиск, поставщика или</tspan><tspan x="700" dy="21">сортировку</tspan></text></g><g><rect x="495" y="245" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="700" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Получить полный список товаров</tspan></text></g><g><path d="M 700 355 L 850 430 L 700 505 L 550 430 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Строка поиска пуста?</tspan></text></g><g><rect x="95" y="580" width="410" height="68" fill="w