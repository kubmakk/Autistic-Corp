or="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">D02: запуск приложения и подключение</tspan><tspan x="700" dy="21">к БД</tspan></text></g><g><path d="M 700 245 L 850 320 L 700 395 L 550 320 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Подключение доступно?</tspan></text></g><g><path d="M 104 470 L 480 470 L 456 534 L 80 534 Z" fill="white" stroke="black" stroke-width="2"/><text x="280" y="498.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="280" dy="0">Показать ошибку подключения и</tspan><tspan x="280" dy="21">инструкцию</tspan></text></g><g><rect x="120" y="580" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="280" y="614" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="280" dy="0">Конец</tspan></text></g><g><rect x="845" y="470" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">D03: открыть окно входа</tspan></text></g><g><path d="M 1050 590 L 1200 665 L 1050 740 L 900 665 Z" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="672" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Вход в роли гостя?</tspan></text></g><g><rect x="465" y="820" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="670" y="850.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="670" dy="0">D05: открыть каталог без поиска,</tspan><tspan x="670" dy="21">фильтра и сортировки</tspan></text></g><g><rect x="510" y="930" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="670" y="964" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="670" dy="0">Конец гостевого сеанса</tspan></text></g><g><path d="M 1069 820 L 1455 820 L 1431 884 L 1045 884 Z" fill="white" stroke="black" stroke-width="2"/><text x="1250" y="859" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1250" dy="0">Ввести логин и пароль</tspan></text></g><g><rect x="1045" y="930" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1250" y="971" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1250" dy="0">Проверить учётные данные</tspan></text></g><g><path d="M 1250 1040 L 1400 1115 L 1250 1190 L 1100 1115 Z" fill="white" stroke="black" stroke-width="2"/><text x="1250" y="1122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1250" dy="0">Данные верны?</tspan></text></g><g><path d="M 674 1270 L 1050 1270 L 1026 1334 L 650 1334 Z" fill="white" stroke="black" stroke-width="2"/><text x="850" y="1309" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="850" dy="0">Показать ошибку и повторить ввод</tspan></text></g><g><rect x="1045" y="1270" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1250" y="1311" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1250" dy="0">Определить роль и открыть интерфейс</tspan></text></g><g><rect x="1045" y="1390" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1250" y="1420.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1250" dy="0">D04-D11: навигация; каталог; поиск;</tspan><tspan x="1250" dy="21">управление товарами; сообщения</tspan></text></g><g><rect x="1090" y="1510" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="1250" y="1544" text-anchor="mi