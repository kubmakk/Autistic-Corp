<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1425" height="1250" viewBox="0 0 1425 1250"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="712.5" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="black">D11. Обработка сообщений и исключительных ситуаций</text><path d="M 700 114 V 150" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 300 V 334 H 260 V 400" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="321" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Информация</text><path d="M 700 300 V 400" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="321" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Ошибка</text><path d="M 700 300 V 334 H 1140 V 400" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="321" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Предупреждение</text><path d="M 260 464 V 636.48 H 700 V 1080" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 464 V 1080" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1140 464 V 590" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1140 740 V 835.2 H 700 V 1080" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="807.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 1140 740 V 820" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="1140" y="761" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 1140 884 V 930" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1140 998 V 1032 H 700 V 1080" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="540" y="60" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Произошло событие</tspan></text></g><g><path d="M 700 150 L 850 225 L 700 300 L 550 225 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Тип события?</tspan></text></g><g><path d="M 84 400 L 460 400 L 436 464 L 60 464 Z" fill="white" stroke="black" stroke-width="2"/><text x="260" y="428.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="260" dy="0">Информация: показать результат</tspan><tspan x="260" dy="21">успешной операции</tspan></text></g><g><path d="M 524 400 L 900 400 L 876 464 L 500 464 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="428.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Ошибка: показать причину и способ</tspan><tspan x="700" dy="21">исправления</tspan></text></g><g><path d="M 964 400 L 1340 400 L 1316 464 L 940 464 Z" fill="white" stroke="black" stroke-width="2"/><text x="1140" y="428.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1140" dy="0">Предупреждение: показать последствия</tspan><tspan x="1140" dy="21">действия</tspan></text></g><g><path d="M 1140 590 L 1290 665 L 1140 740 L 990 665 Z" fill="white" stroke="black" stroke-width="2"/><text x="1140" y="672" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1140" dy="0">Нужно подтверждение?</tspan></text></g><g><path d="M 959 820 L 1345 820 L 1321 884 L 935 884 Z" fill="white" stroke="black" stroke-width="2"/><text x="1140" y="859" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1140" dy="0">Пользователь выбирает «Да» или «Нет»</tspan></text></g><g><rect x="935" y="930" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1140" y="960.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1140" dy="0">Выполнить действие или безопасно</tspan><tspan x="1140" dy="21">отменить</tspan></text></g><g><rect x="540" y="1080" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="1103.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Вернуться к работе с формой или</tspan><tspan x="700" dy="21">каталогом</tspan></text></g></svg>