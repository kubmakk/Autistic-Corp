<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="700" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="black">D01. Импорт данных в базу данных</text><path d="M 700 124 V 160" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 224 V 270" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 338 V 385" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 535 V 569 H 300 V 595" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 700 535 V 569 H 1050 V 595" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 1050 663 V 725" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1050 875 V 909 H 650 V 900" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 1050 875 V 925" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="1050" y="896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 300 659 V 693 H 80 V 236 H 700 V 270" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Исправить файл</text><path d="M 650 964 V 998 H 140 V 236 H 700 V 270" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="675" y="985" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Повторить проверку</text><g><rect x="540" y="70" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Начало</tspan></text></g><g><path d="M 519 160 L 905 160 L 881 224 L 495 224 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Получить файлы с пометкой import</tspan></text></g><g><rect x="495" y="270" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="700" y="300.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Проверить кодировку, обязательные</tspan><tspan x="700" dy="21">поля и связи</tspan></text></g><g><path d="M 700 385 L 850 460 L 700 535 L 550 460 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Данные корректны?</tspan></text></g><g><path d="M 124 595 L 500 595 L 476 659 L 100 659 Z" fill="white" stroke="black" stroke-width="2"/><text x="300" y="634" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="300" dy="0">Показать и записать ошибки импорта</tspan></text></g><g><rect x="845" y="595" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Загрузить подготовленные данные в БД</tspan></text></g><g><path d="M 1050 725 L 1200 800 L 1050 875 L 900 800 Z" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="807" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Импорт успешен?</tspan></text></g><g><path d="M 474 900 L 850 900 L 826 964 L 450 964 Z" fill="white" stroke="black" stroke-width="2"/><text x="650" y="939" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="650" dy="0">Записать ошибку импорта</tspan></text></g><g><rect x="890" y="925" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="959" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Импорт завершён</tspan></text></g></svg>