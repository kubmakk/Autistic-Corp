<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="700" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="black">D03. Авторизация и выход из учётной записи</text><path d="M 700 124 V 165" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 315 V 349 H 300 V 385" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 300 453 V 510" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 315 V 349 H 1050 V 385" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 1050 449 V 495" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1050 563 V 610" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1050 760 V 794 H 610 V 830" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="830" y="781" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 610 894 V 928 H 470 V 351 H 1050 V 385" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="830" y="915" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Повторить ввод</text><path d="M 1050 760 V 830" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="1050" y="781" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 1050 898 V 955" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1050 1023 V 1070" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1050 1124 V 1158 H 1360 V 36 H 700 V 70" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="1145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Выйти</text><g><rect x="540" y="70" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Окно входа</tspan></text></g><g><path d="M 700 165 L 850 240 L 700 315 L 550 240 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Выбран вход в роли гостя?</tspan></text></g><g><rect x="95" y="385" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="300" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="300" dy="0">Открыть каталог: только просмотр</tspan></text></g><g><rect x="140" y="510" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="300" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="300" dy="0">Гостевой сеанс</tspan></text></g><g><path d="M 869 385 L 1255 385 L 1231 449 L 845 449 Z" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Ввести логин и пароль</tspan></text></g><g><rect x="845" y="495" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Проверить учётные данные в БД</tspan></text></g><g><path d="M 1050 610 L 1200 685 L 1050 760 L 900 685 Z" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Данные верны?</tspan></text></g><g><path d="M 434 830 L 810 830 L 786 894 L 410 894 Z" fill="white" stroke="black" stroke-width="2"/><text x="610" y="869" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="610" dy="0">Показать: неверный логин или пароль</tspan></text></g><g><rect x="845" y="830" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="860.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Определить роль и показать ФИО</tspan><tspan x="1050" dy="21">пользователя</tspan></text></g><g><rect x="845" y="955" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="996" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Открыть доступный интерфейс роли</tspan></text></g><g><rect x="890" y="1070" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="1104" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Работа в учётной записи</tspan></text></g></svg>