<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1415" height="1250" viewBox="0 0 1415 1250"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="707.5" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="black">D10. Удаление товара</text><path d="M 700 114 V 145" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 209 V 255" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 405 V 439 H 300 V 490" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 700 405 V 439 H 1050 V 490" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 1050 558 V 610" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1050 760 V 794 H 650 V 840" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="781" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 650 904 V 938 H 1320 V 26 H 700 V 60" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="675" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Вернуться к каталогу</text><path d="M 1050 760 V 794 H 1130 V 840" fill="none" stroke="black" stroke-width="2" marker-end="url