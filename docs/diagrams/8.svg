<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1415" height="1350" viewBox="0 0 1415 1350"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="707.5" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="black">D08. Проверка и сохранение товара</text><path d="M 700 114 V 145" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 213 V 255" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 405 V 439 H 300 V 490" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 300 554 V 588 H 90 V 26 H 700 V 60" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Исправить данные</text><path d="M 700 405 V 439 H 1050 V 490" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 1050 640 V 674 H 650 V 720" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="661" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Нет</text><path d="M 1050 640 V 674 H 1130 V 720" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><text x="1090" y="661" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black" style="paint-order:stroke;stroke:white;stroke-width:6">Да</text><path d="M 650 788 V 822 H 700 V 880" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1130 788 V 822 H 700 V 880" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 948 V 990" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M 700 1054 V 1100" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="540" y="60" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Заполнена форма товара</tspan></text></g><g><rect x="495" y="145" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="700" y="175.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Проверить обязательные поля, цену и</tspan><tspan x="700" dy="21">остаток</tspan></text></g><g><path d="M 700 255 L 850 330 L 700 405 L 550 330 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Значения корректны?</tspan></text></g><g><path d="M 124 490 L 500 490 L 476 554 L 100 554 Z" fill="white" stroke="black" stroke-width="2"/><text x="300" y="518.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="300" dy="0">Подсветить поле и показать текст</tspan><tspan x="300" dy="21">ошибки</tspan></text></g><g><path d="M 1050 490 L 1200 565 L 1050 640 L 900 565 Z" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1050" dy="0">Это новый товар?</tspan></text></g><g><rect x="445" y="720" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="650" y="761" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="650" dy="0">Обновить существующую запись</tspan></text></g><g><rect x="925" y="720" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="1130" y="750.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="1130" dy="0">Вычислить следующий ID и добавить</tspan><tspan x="1130" dy="21">запись</tspan></text></g><g><rect x="495" y="880" width="410" height="68" fill="white" stroke="black" stroke-width="2"/><text x="700" y="921" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Закрыть форму и обновить каталог</tspan></text></g><g><path d="M 524 990 L 900 990 L 876 1054 L 500 1054 Z" fill="white" stroke="black" stroke-width="2"/><text x="700" y="1018.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Показать сообщение об успешном</tspan><tspan x="700" dy="21">сохранении</tspan></text></g><g><rect x="540" y="1100" width="320" height="54" rx="27" fill="white" stroke="black" stroke-width="2"/><text x="700" y="1134" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="black"><tspan x="700" dy="0">Конец</tspan></text></g></svg>